baseURL = "https://tik.projects.metio.wtf/"
locale = "en"
defaultContentLanguage = "en"
theme = "metio"
title = "tik"

enableGitInfo = true
enableRobotsTXT = true
enableInlineShortcodes = true
pygmentsUseClasses = true

# The mounted knowledge bundle carries navigation files that are not site
# pages: kb/index.md is the bundle's own README, and kb/log.md its changelog.
# ignoreFiles is a regex list over the whole render, so it names them by path.
ignoreFiles = ['kb/index\.md$', 'kb/log\.md$']

# The knowledge bundle's markdown predates the site and contains inline HTML;
# Goldmark must pass it through rather than strip it.
[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS", "ATOM", "HUMANS", "FOAF", "LLMS", "LLMSINDEX"]
  section = ["HTML", "RSS", "ATOM"]
  term = ["HTML", "RSS", "ATOM"]

[params]
  mainSections = ["get-started", "concepts", "cli", "authoring", "integrations", "runbooks", "decisions", "contributing"]
  author = "metio.wtf"
  github = "metio/tik"
  fediverseCreator = "@sebhoss@mastodon.online"
  # Render the per-page "see history" / "edit this page" icons next to the
  # title. editContentPath is the repo-root-relative path to this content
  # tree, joined with each page's .File.Path to build the GitHub URLs.
  editContentPath = "docs/content"
  editBranch = "main"
  work = "tik.projects.metio.wtf"
  # Header mark (rendered left of the title) plus the favicon link set; the
  # assets live under docs/static/. Both carry their ink inline because an SVG
  # in an <img>/<link> renders in its own document and cannot inherit the
  # page's colour, which is what the brand files' currentColor expects.
  logo = "/images/logo.svg"
  favicons = true
  # 1200x630 link-preview card (Open Graph / Twitter image), read by Mastodon,
  # Bluesky, LinkedIn, Facebook and X when a page URL is shared.
  socialImage = "/og-image.png"
  description = "a process system, not a ticket system: stage is derived, never stored"
  relatedProjects = [
    { name = "jaas", url = "https://jaas.projects.metio.wtf/" },
    { name = "stageset-controller", url = "https://stageset.projects.metio.wtf/" },
  ]

# Navigation. The theme renders a main-menu entry with a child list only when
# it has children. The menu is a reader's journey — most important first — and
# each group is a content section under docs/content of the same name, so a
# page's URL matches where it sits in the menu.
[menu]
  # 1 ── Get started: a working store in five minutes.
  [[menu.main]]
