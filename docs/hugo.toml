# The knowledge bundle under kb/ is a published artifact in its own right —
# an OKF bundle that agents read from a checkout and that process `:hint`
# fields address by path. Mounting it into the content tree puts the same
# files on the web without relocating one of them, so the on-disk contract
# and the site stay the same documents.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"

  # The guide is the file the test suite executes start to finish
  # (test/tik/guide_test.clj), so publishing the file itself — rather than a
  # copy of it — is what keeps the page and the software in step.
  [[module.mounts]]
    source = "getting-started.md"
    target = "content/get-started/guide.md"

  [[module.mounts]]
    source = "../kb/runbooks"
    target = "content/runbooks"

  [[module.mounts]]
    source = "../kb/decisions"
    target = "content/decisions"

  [[module.mounts]]
    source = "../kb/concepts"
    target = "content/concepts"

  [[module.mounts]]
    source = "static"
    target = "static"
