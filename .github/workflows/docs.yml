name: Documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/**
      # The site publishes the knowledge bundle itself — runbooks a process
      # `:hint` addresses by path, and the decision log — so a change there
      # is a change to the website.
      - kb/**
      # The Claude Code skill page describes what the plugin ships.
      - skills/**
      - .claude-plugin/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - kb/**
      - skills/**
      - .claude-plugin/**
      - .github/workflows/docs.yml
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Clone Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # the theme lives at docs/themes/metio as a submodule
          submodules: recursive
          persist-credentials: false
      - uses: metio/ci/breto@7fe9b6a2209c195154589f3c3238c64e6b54ddc4 # 2026.11.1005244
        with:
          registries: github:metio/toolchains
      - name: Build Website
        run: hugo --minify --printI18nWarnings --printPathWarnings --source docs
      - name: Deploy Website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/public
          force_orphan: true
          cname: tik.projects.metio.wtf
