name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
# Least privilege at the top; the release job raises exactly what it needs.
permissions:
  contents: read
# Serialize releases — release-notes reads tags/history and gh release create
# writes a tag; overlapping runs would race. Never cancel a release in flight.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      needed: ${{ steps.gate.outputs.needed }}
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.gate.outputs.last }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # needs-release / calver read tags and full history
      - id: gate
        # Release only when something that changes the shipped binary/image
        # actually moved since the last tag.
        uses: metio/ci/needs-release@6ccbfec6667dbf259d07ae33159592fb80f4aba2 # 2026.8.4134806
        with:
          paths: deps.edn bb.edn build.clj src cli Containerfile dev/build-native.sh
      - id: version
        if: steps.gate.outputs.needed == 'true'
        # Calendar version (YYYY.M.D + UTC time), shared across every metio artifact.
        uses: metio/ci/calver@6ccbfec6667dbf259d07ae33159592fb80f4aba2 # 2026.8.4134806

  release:
    name: Release
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    # native-image is slow (uberjar + GraalVM compile), then a multi-step buildx
    # push + cosign signing follows.
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release + tag
      packages: write # push the image to GHCR
      id-token: write # cosign keyless (image + checksum blob) via Fulcio OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - name: Build the uberjar and native binary
        # The same toolchain developers run locally — produces target/tik.jar
        # (portable, any JDK) and target/tik (glibc-dynamic linux/amd64 native).
        run: nix develop --command sh dev/build-native.sh
      - id: image
        name: Build, push and sign the container image
        # container-release builds the Containerfile with buildx, pushes
        # <image>:<version> and :latest, attaches SBOM + provenance, and signs
        # the image with cosign keyless. platforms is pinned to linux/amd64
        # because target/tik is a single-arch native binary (no cross-compile).
        uses: metio/ci/container-release@6ccbfec6667dbf259d07ae33159592fb80f4aba2 # 2026.8.4134806
        with:
          image: ghcr.io/${{ github.repository }}
          version: ${{ needs.prepare.outputs.version }}
          file: ./Containerfile
          platforms: linux/amd64
      - name: Assemble release artifacts
        # The portable download for CLI users is the uberjar (any OS + JDK 21);
        # the native binary is offered too, explicitly labelled so nobody
        # mistakes a glibc/amd64 build for a universal one. GraalVM cannot
        # cross-compile, so macOS/Windows/arm users use the uberjar (or the
        # container image, which is the universal deployment path).
        run: |
          mkdir -p dist
          cp target/tik.jar dist/tik.jar
          cp target/tik dist/tik-linux-amd64-glibc
          ( cd dist && sha256sum tik.jar tik-linux-amd64-glibc > SHA256SUMS )
      - name: Sign the checksums (cosign keyless)
        uses: metio/ci/cosign-sign-blob@6ccbfec6667dbf259d07ae33159592fb80f4aba2 # 2026.8.4134806
        with:
          file: dist/SHA256SUMS
      - id: notes
        # git-cliff release notes from the org-wide config.
        uses: metio/ci/release-notes@6ccbfec6667dbf259d07ae33159592fb80f4aba2 # 2026.8.4134806
        with:
          version: ${{ needs.prepare.outputs.version }}
          previous: ${{ needs.prepare.outputs.previous }}
      - name: Publish the GitHub release
        # The release job needs the image pushed first, so a failed build never
        # leaves a published release pointing at a missing image.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$NOTES" \
            dist/tik.jar \
            dist/tik-linux-amd64-glibc \
            dist/SHA256SUMS \
            dist/SHA256SUMS.bundle

      - name: Record the release as evidence
        # The store IS this repository, so a release records itself. The job
        # generates a keypair, binds it to the workflow's own OIDC identity
        # (rung 2, ADR 0023) and signs with it — no long-lived key exists
        # anywhere, and the binding is what makes these signatures checkable
        # afterwards. `processes/release.edn` decides what the evidence adds
        # up to; nothing here sets a stage.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tik() { nix develop --command bb tik "$@"; }

          # the scan is evidence, not a gate: a finding does not stop the
          # release, it stops the ticket reaching :scanned, so the record
          # says whether this version met the bar either way
          if nix develop --command bb vuln; then
            SCAN=:clean
          else
            SCAN=:findings
          fi

          ssh-keygen -q -t ed25519 -N "" -C "ci@${GITHUB_RUN_ID}" \
            -f "${RUNNER_TEMP}/ci_key"
          export TIK_ACTOR=ci TIK_KEY="${RUNNER_TEMP}/ci_key"
          trap 'rm -f "${RUNNER_TEMP}/ci_key" "${RUNNER_TEMP}/ci_key.pub"' EXIT

          tik bridge workload --github --public-key "${TIK_KEY}.pub"

          ID=$(tik new release --title "${VERSION}" | head -1)
          tik set "$ID" version="\"${VERSION}\"" commit="\"${GITHUB_SHA}\""
          tik attach "$ID" dist/SHA256SUMS --as checksums/SHA256SUMS
          tik set "$ID" image="\"${IMAGE}\"" \
                        signature.bundle="\"$(sha256sum dist/SHA256SUMS.bundle | cut -d" " -f1)\""
          tik attest "$ID" :sbom --body "{:source \"container-release\" :image \"${IMAGE}\"}"
          tik attest "$ID" :provenance --body "{:source \"container-release\" :image \"${IMAGE}\"}"
          tik attest "$ID" :vulnerability-scan --body '{:tool "clj-watson" :db "github-advisory"}'
          tik set "$ID" scan.result="$SCAN"

          tik status "$ID"

          # main requires a pull request and a passing check, which a
          # workflow token cannot satisfy, so the evidence does not travel
          # by commit. It ships WITH the release instead: one tarball a
          # third party checks using coreutils, ssh-keygen and openssl —
          # including re-earning this job's signing key from GitHub's own
          # signature over the token that bound it.
          tik bundle "$ID" --out "dist/evidence-${VERSION}.tgz"
          gh release upload "${VERSION}" "dist/evidence-${VERSION}.tgz"
