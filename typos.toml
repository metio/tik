[default.extend-words]
# EDN is extensible data notation, not a typo of END
edn = "edn"
# clojure.core/juxt is a function, strat-* are stratification test names
juxt = "juxt"
strat = "strat"
# fpr is the conventional abbreviation for a key fingerprint
fpr = "fpr"
# selector terms are ANDed together; typos tokenizes "ANDed" as "Ded"
Ded = "Ded"
# `typ` is the JOSE/JWT header field name (RFC 7515), not "typo"/"type"
typ = "typ"
# a body that cannot be parsed is unparseable (a valid variant)
unparseable = "unparseable"
# `nwe` is a deliberately misspelled command in a "not a command" test
nwe = "nwe"
# the in-toto attestation framework, spelled without the hyphen where it
# names a command or a var (tik bridge intoto, intoto-claim)
intoto = "intoto"

[files]
# content-addressed stores and sidecars: filenames and bodies are
# hashes / base64 signatures / EDN, not prose. docs/themes/ is the shared
# metio theme, a separate repository with its own CI — the lint job checks
# out without submodules, so excluding it keeps a local run agreeing with CI
# rather than flagging prose nobody here maintains.
extend-exclude = [
  "corpus/*/tickets/**",
  "tickets/**",
  "roots/**",
  # pinned issuer signing keys: base64url moduli and x5c certificate
  # chains, where a run of letters is coincidence rather than prose
  "jwks/**",
  "flake.lock",
  "docs/themes/",
]
