name: Verify
on:
  merge_group:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  clojure:
    # Reusable Clojure pipeline (kaocha, clj-kondo at fail-on-warning,
    # eastwood, splint, cljfmt, clj-watson) shared across the metio Clojure
    # repos; every gate runs with the toolchain .breto.edn names. Pinned to the
    # release SHA (Renovate bumps it via the version comment).
    name: Clojure
    uses: metio/ci/.github/workflows/clojure.yml@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
    with:
      kondo-paths: src cli test
  tla:
    # The TLC models must pass and ChaoticFixpoint must FAIL — the script
    # asserts the documented counterexample is still found. Apalache must
    # prove every inductive invariant and refute every control; the
    # controls script checks that a broken model fails check.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
        with:
          registries: github:metio/toolchains
      - run: bash spec/check.sh
      - run: bash spec/check-controls.sh
  lean:
    # The Lean model of the derivation function (formal/lean): its proofs
    # build without sorry and rest only on Lean's three standard axioms,
    # leanchecker replays them, and the model agrees with the Clojure kernel
    # on the corpus, every scripted process test and generated cases. The
    # controls plant a sorry and run four broken models, each of which must
    # fail. Lean is installed for this job alone, since its release is
    # several hundred megabytes that no other job needs.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
        with:
          registries: github:metio/toolchains
          packages: lean4@4.36.0 @graalvm @clojure
      - run: bash formal/lean/check.sh
      - run: bash formal/lean/check.sh controls
  process-tests:
    # Scripted process tests: steps in, expected derived stages out,
    # explain printed on failure. The process definitions' own suite.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
        with:
          registries: github:metio/toolchains
      - run: bb tik lint processes/support-request.edn
      - run: bb tik lint processes/sweep-order.edn
      - run: bb tik test processes/support-request.tests.edn
  evidence:
    # The evidence path end to end, on every pull request, in the two halves
    # that can actually go wrong independently.
    #
    # First: the RELEASED tik, installed through our own action — signature
    # and checksums checked — re-derives the RELEASED evidence bundle. That
    # catches a release whose own binary cannot read its own evidence, which
    # no unit test can see because both sides are published artifacts.
    #
    # Then: the tik in THIS commit bundles a ticket and the verify action
    # gates on it, so the action and the --expect flags are exercised by the
    # code under review rather than by whatever shipped last.
    name: Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install # zizmor: ignore[self-repository] runs the copy in this commit
        id: tik
      - name: The released binary re-derives the released bundle
        env:
          VERSION: ${{ steps.tik.outputs.version }}
        run: |
          set -euo pipefail
          tik rederive \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/evidence-${VERSION}.tgz"
      - uses: metio/ci/breto@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
        with:
          registries: github:metio/toolchains
      - name: Bundle a ticket with the tik in this commit
        id: bundle
        run: |
          set -euo pipefail
          # a scratch store, so the check never depends on this repo's own
          # tickets and needs no signing key
          root=$(mktemp -d)
          mkdir -p "${root}/processes"
          cp processes/support-request.edn "${root}/processes/"
          tik() { TIK_ROOT="${root}" TIK_ACTOR=ci bb tik "$@"; }
          # :triaged demands a triager's signature over [:category], and the
          # definition declares somebody else. Putting ci in the role through
          # the store's REGISTER is what makes the expectation below a test of
          # roles.edn travelling: a bundle without it re-derives under the
          # definition's own members, :triaged is not reached, and the gate
          # fails.
          tik roles add triager ci
          id=$(tik new support-request --title "evidence gate" | head -1)
          tik set "$id" category=:billing severity=:low
          tik bundle "$id" --out "${RUNNER_TEMP}/evidence.tgz"
          # the hash comes from the archived definition's own filename, not
          # from a lens — the expectation must be pinned by something the
          # thing under test does not get to choose
          archived=$(find "${root}/processes/by-hash" -name '*.edn' -printf '%f\n' \
            | head -1)
          echo "hash=${archived%.edn}" >> "${GITHUB_OUTPUT}"
      - name: Put this commit's tik on PATH ahead of the released one
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/tik-head"
          mkdir -p "${dir}"
          printf '#!/bin/sh\nexec bb tik "$@"\n' > "${dir}/tik"
          chmod 0755 "${dir}/tik"
          echo "${dir}" >> "${GITHUB_PATH}"
      - uses: ./.github/actions/verify # zizmor: ignore[self-repository] runs the copy in this commit
        with:
          bundle: ${{ runner.temp }}/evidence.tgz
          expect-stage: ":received,:triaged"
          expect-definition: ${{ steps.bundle.outputs.hash }}
  native-smoke:
    # The release runs dev/native-smoke.sh against the native binary. Its
    # controls run here on every pull request, against this checkout under
    # babashka: the script must pass a working tik, fail a binary that
    # exits 1, and pin a broken verb on its own check.
    name: Native smoke controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
        with:
          registries: github:metio/toolchains
      - run: sh dev/native-smoke-controls.sh
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
        with:
          registries: github:metio/toolchains
      - env:
          GH_TOKEN: ${{ github.token }}
        run: breto run ci-lint
  verify:
    # Single required check: mark only this one required in branch
    # protection and new jobs are covered automatically.
    name: Verify
    needs: [clojure, tla, lean, process-tests, evidence, native-smoke, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
