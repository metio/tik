name: Documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/**
      # The site publishes the knowledge bundle itself — runbooks a process
      # `:hint` addresses by path, and the decision log — so a change there
      # is a change to the website.
      - kb/**
      # The Claude Code skill page describes what the plugin ships.
      - skills/**
      - .claude-plugin/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - kb/**
      - skills/**
      - .claude-plugin/**
      - .github/workflows/docs.yml
permissions:
  contents: read
jobs:
  website:
    name: Website
    uses: metio/ci/.github/workflows/hugo.yml@d1d58ce5b2b4dbac322bedd78203810def514bcc # 2026.11.15184511
    permissions:
      contents: write
    with:
      source: docs
      cname: tik.projects.metio.wtf
